<!doctype html>
<!--
  Open Graph card template, 1200x630. 28 Sep 2026.
  Colors and font families come only from public/brand-tokens.css (each var()
  carries its literal fallback, per the site rule). Google Fonts is loaded only
  so the families the tokens name actually render.
  Never put a phone number on an OG image.
  Render with: node scripts/render-og.mjs
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../public/brand-tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Playfair+Display:wght@900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--canvas, #0c0d10);
    color: var(--ink, #f3f4f6);
    box-sizing: border-box;
    padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .logo { width: 96px; height: auto; display: block; }
  h1 {
    font-family: var(--font-headline, 'Playfair Display', Georgia, serif);
    font-weight: 900; text-transform: uppercase;
    font-size: 84px; line-height: 1.02; letter-spacing: -0.01em;
    margin: 0; max-width: 1000px; text-wrap: balance;
  }
  .foot { display: flex; align-items: center; gap: 20px; }
  .rule { width: 48px; height: 3px; background: var(--accent, #10b981); }
  .sub {
    font-family: var(--font-ui, 'Montserrat', sans-serif);
    font-weight: 600; font-size: 20px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--ink-dim, #9ca3af);
  }
</style>
</head>
<body>
  <img class="logo" src="../../public/logo.png" alt="">
  <h1 id="h"></h1>
  <div class="foot"><span class="rule"></span><span class="sub" id="s"></span></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('h').textContent = q.get('h') || '';
  document.getElementById('s').textContent = q.get('s') || '';
</script>
</body>
</html>
